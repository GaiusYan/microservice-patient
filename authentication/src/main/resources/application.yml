server:
  port: 2006
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

spring:
  application:
    name: authentication
  datasource:
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
    url: ${DB_URL}
  jpa:
    properties:
      hibernate:
        show_sql: 'true'
        format_sql: 'true'
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
        ddl-auto: update


logging:
  level:
    org.springframework: DEBUG
    org.hibernate: INFO
    root: INFO

patient:
  application:
    name: patient

DB_USERNAME: 'admin@yandev.com'
DB_PASSWORD: 'mypassword'
DB_URL: 'jdbc:postgresql://localhost:5432/user'